[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bb-langgraph-software-factory"
version = "0.1.0"
description = "Deterministic LangGraph SDLC workflows operated from BB"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "agent-client-protocol>=0.8.1",
  "aiosqlite>=0.21.0",
  "langgraph>=0.6.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "mcp>=1.26,<2",
  "platformdirs>=4.3.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[project.scripts]
software-factory = "software_factory.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
  "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC240", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["software_factory"]
