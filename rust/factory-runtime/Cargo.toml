[package]
name = "factory-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "bd1bd5f450a6489d08e14220809033401282ed67" }
adk-graph = { git = "https://github.com/zavora-ai/adk-rust", rev = "bd1bd5f450a6489d08e14220809033401282ed67", features = ["sqlite"] }
adk-session = { git = "https://github.com/zavora-ai/adk-rust", rev = "bd1bd5f450a6489d08e14220809033401282ed67", features = ["sqlite"] }
adk-server = { git = "https://github.com/zavora-ai/adk-rust", rev = "bd1bd5f450a6489d08e14220809033401282ed67", features = ["background"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util"] }
tokio-util = "0.7"
globset = "0.4"
regex = "1"
serde_yaml = "0.9"
libc = "0.2"

axum = "0.8"
percent-encoding = "2"
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
