[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factory-demo-target"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = ["pytest>=9.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_target"]

[tool.pytest.ini_options]
testpaths = ["tests"]
